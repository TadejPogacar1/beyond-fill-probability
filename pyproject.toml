[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queue-aware-market-making-holdout"
version = "1.0.0"
description = "A frozen seven-day BTC/USDT holdout study of fill and net-outcome models"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Yifan Zhou"}]
keywords = [
  "market-microstructure",
  "market-making",
  "limit-order-book",
  "machine-learning",
  "quantitative-finance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numba>=0.59",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "scikit-learn==1.9.0",
  "tqdm>=4.66",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.1",
  "nbformat>=5.9",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
fill-download = "fill_probability.download:main"
fill-build-book = "fill_probability.book:main"
fill-build-samples = "fill_probability.features:main"
fill-train-models = "fill_probability.training:main"
fill-evaluate-holdout = "fill_probability.holdout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
